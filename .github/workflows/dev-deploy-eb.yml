name: React App CI/CD to Elastic Beanstalk

on:
  push:
    branches: develop   # triggers on push to main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EB_APP_NAME: react-app
      EB_ENV_NAME: react-app-env

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build React app
      - name: Build React app
        run: npm run build

      # 5️⃣ Zip build folder
      - name: Zip build folder
        run: zip -r react-app.zip ./build

      # 6️⃣ Configure AWS CLI with secrets
      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set default.region $AWS_REGION
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # 7️⃣ Create unique S3 bucket (ignore errors if bucket exists)
      - name: Set unique S3 bucket
        run: |
          export S3_BUCKET="react-app-${{ github.repository }}-${{ github.run_id }}"
          echo "S3_BUCKET=$S3_BUCKET" >> $GITHUB_ENV

      - name: Create S3 bucket (ignore errors)
        run: aws s3 mb "s3://$S3_BUCKET" || echo "Bucket exists or cannot create"

      # 8️⃣ Upload ZIP to S3
      - name: Upload ZIP to S3
        run: aws s3 cp react-app.zip s3://$S3_BUCKET/react-app.zip

      # 9️⃣ Ensure EB Application exists
      - name: Ensure EB Application exists
        run: |
          aws elasticbeanstalk describe-applications --application-names $EB_APP_NAME || \
          aws elasticbeanstalk create-application --application-name $EB_APP_NAME

      # 🔟 Ensure EB Environment exists
      - name: Ensure EB Environment exists
        run: |
          aws elasticbeanstalk describe-environments \
            --application-name $EB_APP_NAME \
            --environment-names $EB_ENV_NAME | grep $EB_ENV_NAME || \
          aws elasticbeanstalk create-environment \
            --application-name $EB_APP_NAME \
            --environment-name $EB_ENV_NAME \
            --solution-stack-name "64bit Amazon Linux 2 v5.5.7 running Node.js 20" \
            --version-label initial

      # 1️⃣1️⃣ Create new EB Application Version
      - name: Create new EB Application Version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name $EB_APP_NAME \
            --version-label $GITHUB_SHA \
            --source-bundle S3Bucket=$S3_BUCKET,S3Key=react-app.zip

      # 1️⃣2️⃣ Deploy to EB
      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name $EB_ENV_NAME \
            --version-label $GITHUB_SHA
